<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email Kit · Ignacio Gauna</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#efe9df;font:15px Helvetica,Arial,sans-serif}
.wrap{display:grid;grid-template-columns:340px 1fr;min-height:100vh}
aside{padding:24px;border-right:1px solid #262626}
h1{font:900 22px 'Arial Black',Arial;margin:0 0 4px}small,label{font:11px ui-monospace,Menlo,monospace;letter-spacing:1.5px;text-transform:uppercase;color:#7d7a74;display:block;margin:16px 0 6px}
input,textarea{width:100%;background:#111;border:1px solid #333;color:#efe9df;padding:10px;font:14px inherit;border-radius:0}
textarea{min-height:90px;resize:vertical}
button{background:#ff4d1f;border:0;color:#0a0a0a;font-weight:bold;padding:11px 14px;margin:6px 6px 0 0;cursor:pointer}
button.alt{background:transparent;border:1px solid #3a3a3a;color:#efe9df}
main{padding:24px;background:#050505}iframe{width:100%;max-width:640px;height:1500px;border:0;display:block;margin:0 auto;background:#050505}
#msg{color:#ff4d1f;font:12px ui-monospace,monospace;margin-top:10px;min-height:16px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #262626}}
</style></head><body><div class="wrap"><aside>
<h1>Email Kit</h1><small>Completá, mirá y copiá</small>
<label>Company</label><input id="company" value="Acme AI">
<label>Role</label><input id="role" value="Senior AI Engineer">
<label>First name</label><input id="first_name" value="Sarah">
<label>Stack</label><input id="stack" value="React, Next.js, Node.js, Python and Java">
<label>Why you (1 frase)</label><textarea id="why_you">Your work on document intelligence for legal teams is close to what I built, so I could help from day one.</textarea>
<label>Subject</label><input id="subject" readonly>
<div><button id="cRich">Copy email (rich)</button><button id="cHtml" class="alt">Copy HTML</button><button id="cTxt" class="alt">Copy text</button><button id="cSub" class="alt">Copy subject</button></div>
<div id="msg"></div></aside>
<main><iframe id="pv" title="preview"></iframe></main></div>
<script>
const $=id=>document.getElementById(id),F=["company","role","first_name","stack","why_you"];
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
let H="",T="";
const fill=(t,e)=>t.replaceAll("{{COMPANY}}",e($("company").value)).replaceAll("{{ROLE}}",e($("role").value)).replaceAll("{{FIRST_NAME}}",e($("first_name").value||"there")).replaceAll("{{STACK}}",e($("stack").value)).replaceAll("{{WHY_YOU}}",e($("why_you").value));
const html=()=>fill(H,esc),txt=()=>fill(T,s=>s).replace(/^Subject:.*\n\n/,"");
const subject=()=>`${$("role").value} - Senior AI Fullstack Engineer (RAG in production)`;
function render(){$("pv").srcdoc=html();$("subject").value=subject()}
const say=m=>{$("msg").textContent=m;setTimeout(()=>$("msg").textContent="",2500)};
const copy=async(s,m)=>{await navigator.clipboard.writeText(s);say(m)};
$("cHtml").onclick=()=>copy(html(),"HTML copiado");
$("cTxt").onclick=()=>copy(txt(),"Texto copiado");
$("cSub").onclick=()=>copy(subject(),"Asunto copiado");
$("cRich").onclick=async()=>{const h=html();try{await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([h],{type:"text/html"}),"text/plain":new Blob([txt()],{type:"text/plain"})})]);say("Copiado: pegalo en el redactor de Gmail")}catch(e){say("Tu navegador no permite copiar rico: usá Copy HTML")}};
F.forEach(f=>$(f).addEventListener("input",render));
Promise.all([fetch("template.html").then(r=>r.text()),fetch("template.txt").then(r=>r.text())]).then(([a,b])=>{H=a;T=b;render()});
</script></body></html>
